<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visor: Security Alert</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c10;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #121316;
      border: 1px solid #27272a;
      border-top: 3px solid #dc2626;
      border-radius: 8px;
      padding: 28px 28px 24px;
      max-width: 480px;
      width: 100%;
      text-align: left;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f87171;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .desc {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #a1a1aa;
      margin-bottom: 22px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-back:hover { background: #1d4ed8; }
    .btn-proceed {
      background: transparent;
      color: #71717a;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .btn-proceed:hover {
      border-color: #3f3f46;
      color: #e4e4e7;
    }
    .footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #1f2024;
      font-size: 0.75rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="pill">Security Warning</div>
    <h1 id="module-name">Suspicious activity detected</h1>
    <p class="desc">Visor intercepted this request to protect your credentials and session security.</p>
    <div class="actions">
      <button class="btn-back" onclick="history.back()">Back to safety</button>
      <button class="btn-proceed" onclick="window.close()">Continue anyway (unsafe)</button>
    </div>
    <div class="footer">Protected by Visor</div>
  </div>
</body>
</html>
