<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visor — Security Warning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c12;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #0f1117;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 36px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    h1 {
      color: #ef4444;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn-back {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-back:hover { background: #15803d; }
    .btn-proceed {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .btn-proceed:hover {
      border-color: #64748b;
      color: #e2e8f0;
    }
    .note {
      color: #475569;
      font-size: 0.75rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚠️</div>
    <h1 id="module-name">AiTM attack detected</h1>
    <p class="sub">Visor has blocked this page to protect your credentials.</p>
    <div class="actions">
      <button class="btn-back" onclick="history.back()">← Go back (safe)</button>
      <button class="btn-proceed" onclick="window.close()">Proceed anyway</button>
    </div>
    <p class="note">This warning is generated by the Visor browser extension.</p>
  </div>
</body>
</html>
