<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 360px; min-height: 200px;
      background: #0b0e16; color: #e2e8f0;
      padding: 0;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 8px;
      background: #0f1420; padding: 12px 16px;
      border-bottom: 1px solid #1e2a3a;
    }
    header h1 { font-size: 0.95rem; font-weight: 700; color: #7dd3fc; }
    header .version { font-size: 0.65rem; color: #475569; margin-left: auto; }

    /* ── Verdict banner ── */
    #verdict-banner {
      padding: 10px 16px;
      font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    #verdict-banner.safe       { background: #052e16; color: #4ade80; }
    #verdict-banner.suspicious { background: #450a0a; color: #f87171; }
    #verdict-banner.loading    { background: #1e293b; color: #94a3b8; }
    #verdict-banner .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .safe .dot       { background: #4ade80; }
    .suspicious .dot { background: #f87171; box-shadow: 0 0 6px #f87171; }
    .loading .dot    { background: #64748b; }

    /* ── Module scores ── */
    #modules {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: #1e2a3a;
      border-bottom: 1px solid #1e2a3a;
    }
    .module-card {
      background: #0b0e16; padding: 10px 14px;
    }
    .module-card .label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .module-card .score { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .module-card .score.safe       { color: #4ade80; }
    .module-card .score.suspicious { color: #f87171; }
    .module-card .score.unknown    { color: #475569; }

    /* ── Feature vector ── */
    #features-section { padding: 10px 16px; }
    #features-section h2 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: #475569; margin-bottom: 8px;
    }
    .feature-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid #1e2a3a; font-size: 0.78rem;
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-name { color: #94a3b8; }
    .feature-val  { font-weight: 600; font-variant-numeric: tabular-nums; }
    .feature-val.true    { color: #f87171; }
    .feature-val.false   { color: #4ade80; }
    .feature-val.number  { color: #7dd3fc; }
    .feature-val.pending { color: #475569; font-style: italic; }
    .feature-val.null    { color: #334155; }

    /* ── Footer ── */
    footer {
      padding: 8px 16px; font-size: 0.65rem; color: #334155;
      border-top: 1px solid #1e2a3a;
      display: flex; justify-content: space-between;
    }
    #refresh-btn {
      background: none; border: none; color: #475569;
      font-size: 0.65rem; cursor: pointer; padding: 0;
    }
    #refresh-btn:hover { color: #7dd3fc; }
  </style>
</head>
<body>

<header>
  <span>🛡</span>
  <h1>Visor</h1>
  <span class="version">v0.1.0</span>
</header>

<div id="verdict-banner" class="loading">
  <span class="dot"></span>
  <span id="verdict-text">Loading…</span>
</div>

<div id="modules">
  <div class="module-card" id="mod-aitm">
    <div class="label">AiTM</div>
    <div class="score unknown" id="score-aitm">—</div>
  </div>
  <div class="module-card" id="mod-bitb">
    <div class="label">BiTB</div>
    <div class="score unknown" id="score-bitb">—</div>
  </div>
  <div class="module-card" id="mod-homograph">
    <div class="label">Homograph</div>
    <div class="score unknown" id="score-homograph">—</div>
  </div>
  <div class="module-card" id="mod-clickjacking">
    <div class="label">Clickjacking</div>
    <div class="score unknown" id="score-clickjacking">—</div>
  </div>
</div>

<div id="features-section">
  <h2>Feature Vector</h2>
  <div id="feature-list">
    <div class="feature-row">
      <span class="feature-name">—</span>
      <span class="feature-val pending">waiting…</span>
    </div>
  </div>
</div>

<footer>
  <span id="tab-url" title="">—</span>
  <button id="refresh-btn" title="Refresh">↺</button>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
